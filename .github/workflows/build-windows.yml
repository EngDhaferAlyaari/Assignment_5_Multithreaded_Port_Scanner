name: Build Windows EXE

on:
  push:
    branches: [main]
    paths:
      - 'port_scanner.py'
      - 'test_port_scanner.py'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Get files
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test code on Windows
        run: python -m unittest -v test_port_scanner.py

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Create Windows executable
        run: python -m PyInstaller --onefile --console --noconfirm --clean --name Port_Scanner port_scanner.py

      - name: Check Windows executable
        shell: pwsh
        run: |
          .\dist\Port_Scanner.exe 127.0.0.1 --start 1 --end 1 --timeout 0.2 --workers 1
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Upload Windows executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Port_Scanner_Windows
          path: dist/Port_Scanner.exe

      - name: Add EXE to repository
        shell: pwsh
        run: |
          Copy-Item dist/Port_Scanner.exe Port_Scanner.exe
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Port_Scanner.exe
          if (git status --porcelain -- Port_Scanner.exe) {
            git commit -m 'Add tested Windows executable'
            git push
          }
